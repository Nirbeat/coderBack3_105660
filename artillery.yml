config:
  target: "http://localhost:3000"   # URL BASE A TESTEAR
  phases:                           # DEFINICION DE PRUEBAS
    - duration: 10                  # TIEMPO DE PRUEBA, 10 SEGUNDOS EN ESTE CASO
      arrivalRate: 300                # CANTIDAD DE PRUEBAS POR SEGUNDO

scenarios:                          # ESCENARIOS DE PRUEBA
  - name: "Registro y login de usuarios"
    flow:                           #ACA EMPIEZA EL FLUJO DE PRUEBA
      - log: "Creando usuario con faker"
      - get:
          url: "/api/mocks/mock-user"
          capture:
              - json: "$.user"
                as: "user"
            # - json: "$.first_name"
            #   as: "nombre"
            # - json: "$.user.last_name"
            #   as: "apellido"
            # - json: "$.user.role"
            #   as: "rol"
            # - json: "$.user.email"
            #   as: "email"
            # - json: "$.user.password"
            #   as: "password"
            # - json: "$.user.pets"
            #   as: "mascotas"
            
      - log: "Guardando usuario en DB"
      - post:
          url: "/api/sessions/register"
          json:
            first_name: {{user.first_name}}
            last_name: {{user.last_name}}
            role: {{user.role}}
            email: {{user.email}}
            password: {{user.password}}
            pets: {{user.pets}}
      - think: 2 #ESPERAMOS 2 SEGUNDOS

      - log: "Logueando usuario"
      - post:
          url: "/api/sessions/login"
          json:
            email: {{user.email}}
            password: {{user.password}}
