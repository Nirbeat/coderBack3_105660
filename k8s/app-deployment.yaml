apiVersion: apps/v1
kind: Deployment
metadata:
  name: adoptme-105660
spec:
  replicas: 3
  selector:
    matchLabels:
      app: adoptme-105660
  template:
    metadata:
      labels:
        app: adoptme-105660
    spec:
      containers:
        - name: adoptme-105660
          image: nicolasoritipersonal/be_3_105660:1.0.2
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: MONGO_URI
              value: 'mongodb+srv://<user>:<password>@adoptme.1eelalw.mongodb.net/?appName=adoptme/backend-3-105660'
          resources:
            requests:
              memory: '64Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '500m'
